name: FTC Notice Crawler

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정(UTC 기준)에 실행
  workflow_dispatch: # 수동으로도 실행 가능

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run crawler script
        run: python crawler.py

      - name: Commit and push if notices changed
        run: |
          git config --global user.name 'Crawler Bot'
          git config --global user.email 'bot@example.com'
          git add notices.json
          git commit -m "Auto-update FTC notices" || exit 0
          git push
